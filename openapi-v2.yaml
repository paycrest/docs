openapi: 3.0.3
info:
  title: Paycrest Aggregator API
  version: 1.0.0
  description: |
    OpenAPI schema for the Paycrest Aggregator API. This covers sender, provider, and general endpoints.
tags:
  - name: Sender
    description: Endpoints for senders to create and manage payment orders
  - name: Provider
    description: Endpoints for providers to manage and fulfill orders
  - name: General
    description: General protocol and utility endpoints
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: API-Key
  parameters:
    OptionalOrderDirection:
      name: direction
      in: query
      required: false
      schema:
        type: string
        enum: [onramp, offramp]
      description: |
        Filter to **onramp** (fiat → crypto) or **offramp** (crypto → fiat). Omit to include **both** directions.

        On **stats** endpoints, invalid values return **400 Bad Request**. On **list** endpoints, values other than `onramp` or `offramp` are ignored (no direction filter).

        **HMAC (GET):** the signed payload includes all query parameters—include `direction` when you send it (alongside `timestamp`, `currency`, etc.).
  schemas:

    # Sender Schemas
    NewPaymentOrderPayload:
      type: object
      required:
        - amount
        - token
        - rate
        - network
        - recipient
      properties:
        amount:
          type: number
        token:
          type: string
          description: Token symbol (USDT, USDC, cNGN). See [Supported Stablecoins](/resources/supported-stablecoins) for available options.
        rate:
          type: number
        network:
          type: string
          enum: [ethereum, base, bnb-smart-chain, lisk, celo, arbitrum-one, polygon, starknet, tron]
          description: Network identifier for the blockchain
        recipient:
          $ref: '#/components/schemas/PaymentOrderRecipient'
        reference:
          type: string
        returnAddress:
          type: string
    PaymentOrderRecipient:
      type: object
      required:
        - institution
        - accountIdentifier
        - accountName
        - memo
      properties:
        institution:
          type: string
          description: Institution code (SWIFT code or custom PayCrest code ending with 'PC'). See [Code Standards](/resources/code-standards) for details.
        accountIdentifier:
          type: string
          description: Bank account number, mobile number, or other account identifier
        accountName:
          type: string
          description: Name of the account holder
        memo:
          type: string
          description: Memo or reference for the transaction
        providerId:
          type: string
          description: Optional provider ID for specific routing
        metadata:
          type: object
          description: Additional metadata for the transaction
        currency:
          type: string
          description: ISO 4217 currency code (e.g., NGN, KES, UGX). See [Supported Currencies](/resources/supported-currencies) for available options.
    ReceiveAddressResponse:
      type: object
      properties:
        id:
          type: string
        amount:
          type: string
        token:
          type: string
          description: Token symbol (USDT, USDC, cNGN). See [Supported Stablecoins](/resources/supported-stablecoins) for available options.
        network:
          type: string
          enum: [ethereum, base, bnb-smart-chain, lisk, celo, arbitrum-one, polygon, starknet, tron]
          description: Network identifier for the blockchain
        receiveAddress:
          type: string
        validUntil:
          type: string
          format: date-time
        senderFee:
          type: string
        transactionFee:
          type: string
        reference:
          type: string
        orderType:
          type: string
    SenderOrderResponse:
      type: object
      properties:
        id:
          type: string
        amount:
          type: string
        amountInUsd:
          type: string
        amountPaid:
          type: string
        amountReturned:
          type: string
        token:
          type: string
          description: Token symbol (USDT, USDC, cNGN). See [Supported Stablecoins](/resources/supported-stablecoins) for available options.
        senderFee:
          type: string
        transactionFee:
          type: string
        rate:
          type: string
        network:
          type: string
          enum: [ethereum, base, bnb-smart-chain, lisk, celo, arbitrum-one, polygon, starknet, tron]
          description: Network identifier for the blockchain
        gatewayId:
          type: string
        recipient:
          $ref: '#/components/schemas/PaymentOrderRecipient'
        fromAddress:
          type: string
        returnAddress:
          type: string
          description: Deprecated — use refundAddress
        refundAddress:
          type: string
        receiveAddress:
          type: string
        feeAddress:
          type: string
        reference:
          type: string
        orderType:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        txHash:
          type: string
        status:
          type: string
        transactionLogs:
          type: array
          items:
            $ref: '#/components/schemas/TransactionLog'
    SenderPaymentOrderList:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        orders:
          type: array
          items:
            $ref: '#/components/schemas/SenderOrderResponse'
    SenderStatsResponse:
      type: object
      properties:
        totalOrders:
          type: integer
        totalOrderVolume:
          type: string
        totalFeeEarnings:
          type: string

    # Provider Schemas
    ProviderOrderList:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        orders:
          type: array
          items:
            $ref: '#/components/schemas/ProviderOrderResponse'
    ProviderOrderResponse:
      type: object
      properties:
        id:
          type: string
        token:
          type: string
          description: Token symbol (USDT, USDC, cNGN). See [Supported Stablecoins](/resources/supported-stablecoins) for available options.
        gatewayId:
          type: string
        amount:
          type: string
        amountInUsd:
          type: string
        rate:
          type: string
        blockNumber:
          type: integer
        txHash:
          type: string
        institution:
          type: string
          description: Institution code (SWIFT code or custom PayCrest code ending with 'PC'). See [Code Standards](/resources/code-standards) for details.
        accountIdentifier:
          type: string
        accountName:
          type: string
        providerId:
          type: string
        memo:
          type: string
        network:
          type: string
          enum: [ethereum, base, bnb-smart-chain, lisk, celo, arbitrum-one, polygon, starknet, tron]
          description: Network identifier for the blockchain
        orderType:
          type: string
        status:
          type: string
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        transactionLogs:
          type: array
          items:
            $ref: '#/components/schemas/TransactionLog'
        cancellationReasons:
          type: array
          items:
            type: string
    AcceptOrderResponse:
      type: object
      properties:
        id:
          type: string
        amount:
          type: number
        institution:
          type: string
          description: Institution code (SWIFT code or custom PayCrest code ending with 'PC'). See [Code Standards](/resources/code-standards) for details.
        accountIdentifier:
          type: string
        accountName:
          type: string
        memo:
          type: string
        metadata:
          type: object
    FulfillLockOrderPayload:
      type: object
      required:
        - psp
        - txId
      properties:
        psp:
          type: string
        txId:
          type: string
        validationStatus:
          type: string
        validationError:
          type: string
    CancelLockOrderPayload:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
    MarketPosition:
      type: object
      description: |
        Provider's rate standing versus the best public peer in the same corridor.
        Omitted when no qualifying public offers exist or the provider has no effective rate for the corridor (backward compatible).
      properties:
        bestPublicRate:
          type: string
          description: Best rate among enabled non-testnet public peers for this side (highest effective sell rate; lowest effective buy rate).
        yourEffectiveRate:
          type: string
          description: The provider's own effective rate for this corridor and side.
        deltaVsBest:
          type: string
          description: |
            `yourEffectiveRate − bestPublicRate`. For **sell** a positive delta means you offer a higher rate than the best peer (more competitive). For **buy** a negative delta means you offer a lower rate than the best peer (more competitive).
    MarketRateSide:
      type: object
      description: Tolerance band for one side (buy or sell) of the market rate.
      properties:
        marketRate:
          type: string
          description: Reference market rate for this side (fiat per crypto).
        minimumRate:
          type: string
          description: Minimum allowed rate for this side.
        maximumRate:
          type: string
          description: Maximum allowed rate for this side.
        position:
          allOf:
            - $ref: '#/components/schemas/MarketPosition'
          description: Rate benchmark vs. best public peer. Omitted when no public benchmark exists (backward compatible).
    MarketRateResponse:
      type: object
      description: Market rate bounds split by side. Either or both of `buy` and `sell` may be present depending on corridor configuration.
      properties:
        buy:
          $ref: '#/components/schemas/MarketRateSide'
        sell:
          $ref: '#/components/schemas/MarketRateSide'
    MarketOffer:
      type: object
      description: |
        One provider quote row in the public markets orderbook (one row per provider × side × token × fiat × network).
        All funded, available providers appear regardless of visibility setting—only `is_available`, funded, enabled, and non-testnet gating applies.
      properties:
        providerId:
          type: string
          description: Provider identifier.
        side:
          type: string
          enum: [sell, buy]
          description: '`sell` = offramp (crypto → fiat); `buy` = onramp (fiat → crypto).'
        token:
          type: string
          description: Token symbol (e.g. `USDT`, `USDC`).
        fiat:
          type: string
          description: Fiat currency code (e.g. `NGN`, `KES`).
        network:
          type: string
          description: Network identifier (e.g. `base`, `ethereum`).
        rate:
          type: string
          description: Provider's effective exchange rate for this row (fiat per crypto for sell; crypto per fiat for buy).
        rateType:
          type: string
          enum: [fixed, floating]
          description: Whether the rate is fixed or floating.
        min:
          type: string
          description: Minimum order amount accepted by this provider for this corridor.
        max:
          type: string
          description: Maximum order amount accepted by this provider for this corridor.
        balance:
          type: string
          description: |
            Provider's available liquidity for this side. For **sell** this is in fiat (`balanceCurrency` = fiat code);
            for **buy** this is in token (`balanceCurrency` = token symbol).
            The balance is the shared pool repeated across a provider's networks for the same fiat/token—
            de-duplicate by `providerId + fiat` (sell) or `providerId + token` (buy) when summing depth.
        balanceCurrency:
          type: string
          description: Currency of `balance` — fiat code for sell rows, token symbol for buy rows.
        balanceUsd:
          type: string
          description: Balance normalised to USD.
        settled:
          type: integer
          description: Total number of settled orders for this provider in this corridor.
        successPercent:
          type: string
          nullable: true
          description: Provider's success rate (settled / (settled + refunded)) as a percentage string. `null` when there is no settled or refunded history.
    MarketsWindowedVolume:
      type: object
      description: A USD/amount metric broken down across time windows.
      properties:
        24h:
          type: string
          description: Value over the past 24 hours.
        7d:
          type: string
          description: Value over the past 7 days.
        30d:
          type: string
          description: Value over the past 30 days.
        all:
          type: string
          description: All-time value.
    MarketsWindowedCount:
      type: object
      description: An integer count metric broken down across time windows.
      properties:
        24h:
          type: integer
          description: Count over the past 24 hours.
        7d:
          type: integer
          description: Count over the past 7 days.
        30d:
          type: integer
          description: Count over the past 30 days.
        all:
          type: integer
          description: All-time count.
    MarketsWindowedSuccess:
      type: object
      description: Success-percentage metric across 24h/7d/30d windows. Null for a window when no terminal orders exist in that window.
      properties:
        24h:
          type: string
          nullable: true
          description: Network success rate over the past 24 hours (null if no terminal orders).
        7d:
          type: string
          nullable: true
          description: Network success rate over the past 7 days (null if no terminal orders).
        30d:
          type: string
          nullable: true
          description: Network success rate over the past 30 days (null if no terminal orders).
    MarketsWindowedMedian:
      type: object
      description: Median delivery time in seconds across windows. Null for a window when no data exists.
      properties:
        24h:
          type: integer
          nullable: true
          description: Median delivery seconds over the past 24 hours.
        7d:
          type: integer
          nullable: true
          description: Median delivery seconds over the past 7 days.
        30d:
          type: integer
          nullable: true
          description: Median delivery seconds over the past 30 days.
    MarketsAggregates:
      type: object
      description: Network-wide stats block included in the markets response.
      properties:
        settledVolumeUsd:
          allOf:
            - $ref: '#/components/schemas/MarketsWindowedVolume'
          description: USD volume of settled orders across windows.
        settledTxns:
          allOf:
            - $ref: '#/components/schemas/MarketsWindowedCount'
          description: Count of settled transactions across windows.
        networkSuccessPercent:
          allOf:
            - $ref: '#/components/schemas/MarketsWindowedSuccess'
          description: Network-wide success rate (settled / (settled + refunded)) across windows.
        medianDeliverySecs:
          allOf:
            - $ref: '#/components/schemas/MarketsWindowedMedian'
          description: Median order delivery time in seconds across windows.
        activeProviders:
          allOf:
            - $ref: '#/components/schemas/MarketsWindowedCount'
          description: Count of distinct providers with at least one settled order across windows.
        activeSenders:
          allOf:
            - $ref: '#/components/schemas/MarketsWindowedCount'
          description: Count of distinct senders with at least one settled order across windows.
        liveLiquidityUsd:
          type: string
          description: Total available USD-denominated liquidity across all book rows.
        corridors:
          type: integer
          description: Number of distinct token/fiat pairs currently in the book.
        tokens:
          type: integer
          description: Number of distinct tokens currently in the book.
        networks:
          type: integer
          description: Number of distinct networks currently in the book.
    MarketsResponse:
      type: object
      description: Public markets orderbook and network-wide aggregates.
      properties:
        asOf:
          type: string
          format: date-time
          description: Timestamp when the response was generated (ISO 8601 UTC).
        aggregates:
          $ref: '#/components/schemas/MarketsAggregates'
        book:
          type: array
          items:
            $ref: '#/components/schemas/MarketOffer'
          description: Array of provider quote rows forming the live orderbook.
    V2RateQuoteSide:
      type: object
      description: Quote details for one side from the public v2 rates endpoint.
      properties:
        rate:
          type: string
          description: Achievable rate (fiat per crypto) for this side and notional. This is the rate of `providerIds[0]`.
        providerIds:
          type: array
          maxItems: 3
          items:
            type: string
          description: |
            Ranked provider queue for this side, best first — the order assignment would try them in.
            Up to 3 ids by default; use `limit` to request fewer. `providerIds[0]` is the provider whose rate
            is quoted in `rate`. Returns a single id when `provider_id` pins the quote. The fallback provider
            is never listed. Always an array — `[]` when no provider is available, never `null`. Pass these ids
            to `destination.providerIds` on order creation to lock routing to the providers you quoted.
        orderType:
          type: string
          description: Order flow type, e.g. `regular`.
        refundTimeoutMinutes:
          type: integer
          description: Minutes until automatic refund for this flow.
    V2RateQuoteResponse:
      type: object
      description: Public token rate quote. Omit `side` to receive both buy and sell; use `side=buy` or `side=sell` for a single side.
      properties:
        buy:
          $ref: '#/components/schemas/V2RateQuoteSide'
        sell:
          $ref: '#/components/schemas/V2RateQuoteSide'
    ProviderStatsResponse:
      type: object
      properties:
        totalOrders:
          type: integer
        totalFiatVolume:
          type: string
        totalCryptoVolume:
          type: string

    # General Schemas
    SupportedCurrencies:
      type: object
      properties:
        code:
          type: string
          description: ISO 4217 currency code (e.g., NGN, KES, UGX). See [Supported Currencies](/resources/supported-currencies) for available options.
        name:
          type: string
        shortName:
          type: string
        decimals:
          type: integer
        symbol:
          type: string
        marketBuyRate:
          type: string
        marketSellRate:
          type: string
    SupportedInstitutions:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
          description: Institution code (SWIFT code or custom PayCrest code ending with 'PC'). See [Code Standards](/resources/code-standards) for details.
        type:
          type: string
    SupportedTokenResponse:
      type: object
      properties:
        symbol:
          type: string
          description: Token symbol (USDT, USDC, cNGN). See [Supported Stablecoins](/resources/supported-stablecoins) for available options.
        contractAddress:
          type: string
        decimals:
          type: integer
        baseCurrency:
          type: string
        network:
          type: string
          enum: [ethereum, base, bnb-smart-chain, lisk, celo, arbitrum-one, polygon, starknet, tron, solana]
          description: Network identifier for the blockchain
        settlementNetwork:
          type: string
          description: Present only when `network` is a bridge rail, and its presence is what marks one — funds in this token are carried to the network named here, where the order settles and is priced (off-ramp deposits today). Set per token — a rail can carry one symbol to one network and another symbol elsewhere. See [Bridge rails](/implementation-guides/bridge-rails).

    # Order Status Schemas
    ProviderOrderStatusResponse:
      type: object
      properties:
        orderId:
          type: string
        amount:
          type: string
        amountInUsd:
          type: string
        token:
          type: string
          description: Token symbol (USDT, USDC, cNGN). See [Supported Stablecoins](/resources/supported-stablecoins) for available options.
        network:
          type: string
          enum: [ethereum, base, bnb-smart-chain, lisk, celo, arbitrum-one, polygon, starknet, tron]
          description: Network identifier for the blockchain
        settlePercent:
          type: string
        status:
          type: string
        txHash:
          type: string
        settlements:
          type: array
          items:
            $ref: '#/components/schemas/PaymentOrderSplitOrder'
        txReceipts:
          type: array
          items:
            $ref: '#/components/schemas/PaymentOrderTxReceipt'
        updatedAt:
          type: string
          format: date-time
    PaymentOrderSplitOrder:
      type: object
      properties:
        splitOrderId:
          type: string
        amount:
          type: string
        rate:
          type: string
        orderPercent:
          type: string
    PaymentOrderTxReceipt:
      type: object
      properties:
        status:
          type: string
        txHash:
          type: string
        timestamp:
          type: string
          format: date-time

    # Common Schemas
    TransactionLog:
      type: object
      properties:
        id:
          type: string
        gateway_id:
          type: string
        status:
          type: string
        tx_hash:
          type: string
        created_at:
          type: string
          format: date-time

    # System Schemas
    VerifyAccountRequest:
      type: object
      required:
        - institution
        - accountIdentifier
      properties:
        institution:
          type: string
          description: Institution code (SWIFT code or custom PayCrest code ending with 'PC'). See [Code Standards](/resources/code-standards) for details.
        accountIdentifier:
          type: string
          description: |
            Bank account number, mobile wallet MSISDN, Till/Paybill identifier, or other account identifier.

            For **mobile_money** institutions, the API normalizes phone numbers before verification: strips `+`, removes a leading domestic `0`, and adds the country dial code when missing (KES 254, UGX 256, TZS 255, GHS 233). Examples for KES M-Pesa — `0712345678`, `+254712345678`, and `254712345678` all normalize to `254712345678`.

            KES Till/Paybill identifiers are not normalized when `metadata` indicates Till/Paybill, or when the value looks like Paybill (`business|reference`) or Till (fewer than 9 digits).
        metadata:
          type: object
          additionalProperties: true
          description: |
            Optional. Used for KES Till/Paybill verify so phone normalization is not applied. Same semantics as recipient `metadata` on order create (e.g. `channel` Till or Paybill, `businessNumber`).
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Error message
        data:
          nullable: true
          description: "null on most errors; an array of field-level errors on validation failures"
          oneOf:
            - type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
            - type: object
              additionalProperties: true
    StandardResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Operation successful
        data:
          type: object
          description: The actual response data (e.g., ReceiveAddressResponse, etc.)

    # ─── V2 Schemas ────────────────────────────────────────────────────────────

    V2PaymentOrderPayload:
      type: object
      required:
        - amount
        - source
        - destination
      properties:
        amount:
          type: string
          description: Payment amount. Denomination is determined by `amountIn` (defaults to crypto units).
          example: "100"
        amountIn:
          type: string
          enum: [crypto, fiat]
          description: Specifies whether `amount` is denominated in crypto or fiat. Defaults to `crypto`.
        rate:
          type: string
          description: Quoted exchange rate (fiat per crypto unit). Optional — protocol uses best available rate if omitted.
        senderFee:
          type: string
          description: Fixed sender fee in crypto units. Mutually exclusive with `senderFeePercent`. When the effective sender fee is greater than zero, `senderFeeAddress` (or a fee address configured on the sender profile) is required.
          example: "0.5"
        senderFeePercent:
          type: string
          description: Sender fee as a percentage of the order amount (alternative to `senderFee`). Mutually exclusive with `senderFee`. When the effective sender fee is greater than zero, `senderFeeAddress` (or a fee address configured on the sender profile) is required.
          example: "1"
        senderFeeAddress:
          type: string
          description: |
            Optional fee recipient address for this order. Required when the effective sender fee is greater than zero
            (from `senderFee`, `senderFeePercent`, or a profile-configured fee) and no fee address is configured on the
            sender profile for the token. Not required when the effective fee is zero. Must be a valid address for the
            order's crypto source or destination network, including bridge rails such as Solana.
          example: "0xYourFeeRecipientAddress"
        reference:
          type: string
          description: Your internal reference ID for this order.
        source:
          description: "Polymorphic source — set `type: \"crypto\"` for offramp or `type: \"fiat\"` for onramp."
          oneOf:
            - $ref: '#/components/schemas/V2CryptoSource'
            - $ref: '#/components/schemas/V2FiatSource'
          discriminator:
            propertyName: type
            mapping:
              crypto: '#/components/schemas/V2CryptoSource'
              fiat: '#/components/schemas/V2FiatSource'
        destination:
          description: "Polymorphic destination — set `type: \"fiat\"` for offramp or `type: \"crypto\"` for onramp."
          oneOf:
            - $ref: '#/components/schemas/V2FiatDestination'
            - $ref: '#/components/schemas/V2CryptoDestination'
          discriminator:
            propertyName: type
            mapping:
              fiat: '#/components/schemas/V2FiatDestination'
              crypto: '#/components/schemas/V2CryptoDestination'

    V2CryptoSource:
      type: object
      required: [type, currency, network, refundAddress]
      properties:
        type:
          type: string
          enum: [crypto]
        currency:
          type: string
          description: Stablecoin symbol (e.g. USDT, USDC, cNGN)
        network:
          type: string
          enum: [ethereum, base, bnb-smart-chain, lisk, celo, arbitrum-one, polygon, starknet, tron, solana]
          description: Network the deposit is made on. `solana` is a bridge rail — see [Bridge rails](/implementation-guides/bridge-rails).
        refundAddress:
          type: string
          description: Wallet address on `network` for refunds if the order can't be fulfilled. On a bridge rail this is an origin-chain address (e.g. a Solana address) and every refund lands there.

    V2FiatSource:
      type: object
      required: [type, currency, refundAccount]
      properties:
        type:
          type: string
          enum: [fiat]
        currency:
          type: string
          description: Fiat currency code (e.g. NGN, KES, TZS)
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code (optional)
        refundAccount:
          $ref: '#/components/schemas/V2FiatRefundAccount'

    V2FiatRefundAccount:
      type: object
      required: [institution, accountIdentifier, accountName]
      properties:
        institution:
          type: string
          description: Bank or mobile provider code (SWIFT prefix or Paycrest institution code)
        institutionName:
          type: string
          description: Human-readable institution name (e.g. OPay). Present on GET responses when the code resolves in Paycrest.
        accountIdentifier:
          type: string
          description: Account number or mobile number
        accountName:
          type: string
          description: Account holder name

    V2FiatDestination:
      type: object
      required: [type, currency, recipient]
      properties:
        type:
          type: string
          enum: [fiat]
        currency:
          type: string
          description: Fiat currency code (e.g. NGN, KES)
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code (optional)
        providerId:
          type: string
          description: |
            Pin order to a single provider (optional). Retained for backward compatibility —
            prefer `providerIds`, which expresses the same thing as a one-entry queue.
        providerIds:
          type: array
          writeOnly: true
          maxItems: 3
          items:
            type: string
            pattern: '^[A-Za-z]{8}$'
          description: |
            Optional ordered provider queue (max 3). Assignment tries entries in order, moving to the next
            when one declines, expires, or exhausts its retries. Typically the `providerIds` from a
            [rate quote](/api-reference/general/get-token-rate).
            Mutually exclusive with `providerId` — sending both returns **400**.
            A one-entry queue is exactly a single-provider pin, so `providerIds: [X]` routes like
            `providerId: X` for every provider you can pin.
            Multi-entry queues must name providers that can serve this corridor: active, with a live
            standard offer, and — for a provider restricted to specific senders — one whose list
            includes you. The fallback provider may be listed but is ignored; it is already tried
            after the queue is exhausted.
            Accepted on create only; order responses and webhooks return the singular assigned `providerId`.
        kyc:
          type: object
          description: Optional destination (recipient) KYC for offramp. Do not send sender or provider KYB on offramp create.
        recipient:
          $ref: '#/components/schemas/V2FiatRecipient'

    V2FiatRecipient:
      type: object
      required: [institution, accountIdentifier, accountName, memo]
      properties:
        institution:
          type: string
          description: Institution code (e.g. SAFAKEPC for Safaricom M-Pesa). Till and Paybill use the same mobile institution with channel metadata.
        institutionName:
          type: string
          description: Human-readable institution name (e.g. OPay). Present on GET responses when the code resolves in Paycrest.
        accountIdentifier:
          type: string
          description: Bank account, mobile phone (E.164 or local), till number, or paybill account reference depending on channel.
        accountName:
          type: string
        memo:
          type: string
          description: Payment narration / reference
        metadata:
          type: object
          description: Corridor-specific hints. For KES mobile offramp, use channel and optional businessNumber (see Sender API Integration guide).
          properties:
            channel:
              type: string
              enum: [Mobile, Till, Paybill]
              description: KES payout channel. Mobile = phone M-Pesa; Till = buy goods; Paybill = paybill. Omit for default phone M-Pesa when accountIdentifier is a mobile number.
            businessNumber:
              type: string
              description: Paybill business number (required for Paybill when not inferrable from accountIdentifier alone).

    V2CryptoDestination:
      type: object
      required: [type, currency, recipient]
      properties:
        type:
          type: string
          enum: [crypto]
        currency:
          type: string
          description: Stablecoin symbol (e.g. USDT, USDC)
        providerId:
          type: string
          description: |
            Pin order to a single provider (optional). Retained for backward compatibility —
            prefer `providerIds`.
        providerIds:
          type: array
          writeOnly: true
          maxItems: 1
          items:
            type: string
            pattern: '^[A-Za-z]{8}$'
          description: |
            Optional provider pin in queue form, for parity with offramp. Onramp selects its provider
            when the order is created rather than walking a queue, so **at most one entry** is
            accepted — more returns **400**. Mutually exclusive with `providerId`.
            The provider must be one you can route to: pinning a provider restricted to other
            senders returns **400**.
            Accepted on create only; order responses and webhooks return the singular assigned `providerId`.
        recipient:
          $ref: '#/components/schemas/V2CryptoRecipient'

    V2CryptoRecipient:
      type: object
      required: [address, network]
      properties:
        address:
          type: string
          description: Wallet address to receive stablecoins
        network:
          type: string
          enum: [ethereum, base, bnb-smart-chain, lisk, celo, arbitrum-one, polygon, starknet, tron]

    V2CryptoProviderAccount:
      type: object
      description: Returned for offramp orders — where to send the stablecoins. On a bridge rail, `receiveAddress` is the bridge deposit address on the origin chain and `amountToTransfer` is the exact origin amount to send.
      properties:
        network:
          type: string
          description: Network to send on (the origin chain for bridge rails)
        receiveAddress:
          type: string
          description: Address on `network` to send stablecoins to
        validUntil:
          type: string
          format: date-time
          description: Deadline for the stablecoin deposit
        memo:
          type: string
          description: Bridge rails only — a memo that MUST accompany the deposit on chains that share deposit addresses. Absent when not required.
        amountToTransfer:
          type: string
          description: Bridge rails only — the exact amount of `currency` to send on `network`. It already includes the bridge fee; `amount + senderFee + transactionFee` is what arrives on the settlement network.
        currency:
          type: string
          description: Bridge rails only — the origin-chain asset symbol to send.

    V2BridgeLeg:
      type: object
      description: One cross-chain hop of a bridge-backed order
      properties:
        status:
          type: string
          enum: [pending_deposit, known_deposit_tx, processing, success, incomplete_deposit, refunded, failed, expired, dust]
          description: |
            `pending_deposit` nothing seen at the deposit address · `known_deposit_tx` the deposit tx is seen but
            unconfirmed · `processing` deposit confirmed, transfer in flight · `success` delivered · `incomplete_deposit`
            deposit below the quoted minimum, refunded by the bridge · `refunded` the bridge returned the deposit ·
            `failed` terminal without a known refund (operations follow up) · `expired` the deposit window closed with
            nothing deposited · `dust` (reverse only) balance too small to bridge, left in custody
        depositAddress:
          type: string
          description: Deposit address for this hop. On the forward leg this is also returned as `providerAccount.receiveAddress`.
        minAmountIn:
          type: string
          description: Smallest deposit the bridge will accept for this hop
        amountOut:
          type: string
          description: Amount delivered by the hop, in its destination asset
        depositedAmount:
          type: string
          description: >-
            What actually arrived at the deposit address, as the bridge counted it. Absent until the
            bridge reports a deposit. Compare the forward leg with `providerAccount.amountToTransfer`;
            the sender may round up, and the bridge can deduct its own intake fee before the swap.
        originTxHash:
          type: string
        destinationTxHash:
          type: string
        refundedAmount:
          type: string
          description: Amount the bridge returned to the hop's refund address, when it refunded
        refundReason:
          type: string
        updatedAt:
          type: string
          format: date-time

    V2Bridge:
      type: object
      description: Present only on orders that use a bridge rail. `forward` is the hop that funds the order (origin chain → settlement network); `reverse` appears once a refund is being carried back to the origin chain.
      properties:
        settlementNetwork:
          type: string
          description: Native network the order settles on; `txHash` values on the order are on this chain
        settlementCurrency:
          type: string
          description: Asset delivered to the settlement network
        forward:
          $ref: '#/components/schemas/V2BridgeLeg'
        reverse:
          $ref: '#/components/schemas/V2BridgeLeg'

    V2FiatProviderAccount:
      type: object
      description: Returned for onramp orders — the virtual account to deposit fiat into
      properties:
        institution:
          type: string
          description: Institution label for the virtual account (human-readable; from provider or stored metadata).
        accountIdentifier:
          type: string
          description: Account number or mobile number to send fiat to
        accountName:
          type: string
        amountToTransfer:
          type: string
          description: Exact fiat amount the user must deposit
        currency:
          type: string
          description: Fiat currency code
        validUntil:
          type: string
          format: date-time
          description: Deadline — order expires if fiat not received by this time

    V2PaymentOrderResponse:
      type: object
      description: Response returned when creating an order
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        orderType:
          type: string
          enum: [regular]
        timestamp:
          type: string
          format: date-time
        amount:
          type: string
          description: Crypto amount in token units
        rate:
          type: string
        senderFee:
          type: string
        senderFeePercent:
          type: string
        transactionFee:
          type: string
        reference:
          type: string
        providerAccount:
          description: Crypto provider account for offramp; fiat provider account (virtual account) for onramp
          oneOf:
            - $ref: '#/components/schemas/V2CryptoProviderAccount'
            - $ref: '#/components/schemas/V2FiatProviderAccount'
        source:
          oneOf:
            - $ref: '#/components/schemas/V2CryptoSource'
            - $ref: '#/components/schemas/V2FiatSource'
        destination:
          oneOf:
            - $ref: '#/components/schemas/V2FiatDestination'
            - $ref: '#/components/schemas/V2CryptoDestination'
        bridge:
          $ref: '#/components/schemas/V2Bridge'

    V2PaymentOrderGetResponse:
      type: object
      description: Response for a single order (or list item)
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [initiated, deposited, pending, fulfilling, fulfilled, validated, settling, settled, cancelled, refunding, refunded, expired]
        orderType:
          type: string
          enum: [regular]
        direction:
          type: string
          enum: [offramp, onramp]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        amount:
          type: string
        amountInUsd:
          type: string
        amountPaid:
          type: string
        amountReturned:
          type: string
        percentSettled:
          type: string
        rate:
          type: string
        senderFee:
          type: string
        senderFeePercent:
          type: string
        transactionFee:
          type: string
        reference:
          type: string
        txHash:
          type: string
        providerAccount:
          oneOf:
            - $ref: '#/components/schemas/V2CryptoProviderAccount'
            - $ref: '#/components/schemas/V2FiatProviderAccount'
        source:
          oneOf:
            - $ref: '#/components/schemas/V2CryptoSource'
            - $ref: '#/components/schemas/V2FiatSource'
        destination:
          oneOf:
            - $ref: '#/components/schemas/V2FiatDestination'
            - $ref: '#/components/schemas/V2CryptoDestination'
        bridge:
          $ref: '#/components/schemas/V2Bridge'

    V2PaymentOrderListResponse:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        orders:
          type: array
          items:
            $ref: '#/components/schemas/V2PaymentOrderGetResponse'

    V2WebhookPayload:
      type: object
      description: Webhook payload for v2 payment order events
      properties:
        event:
          type: string
          enum: [payment_order.deposited, payment_order.pending, payment_order.validated, payment_order.settling, payment_order.settled, payment_order.refunding, payment_order.refunded, payment_order.expired, payment_order.compliance_hold, payment_order.bridge_deposit_detected, payment_order.bridge_refunded]
        webhookVersion:
          type: string
          enum: ["2"]
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            direction:
              type: string
              enum: [offramp, onramp]
            status:
              type: string
            amount:
              type: string
            amountInUsd:
              type: string
            amountPaid:
              type: string
            amountReturned:
              type: string
            percentSettled:
              type: string
            senderFee:
              type: string
            transactionFee:
              type: string
            rate:
              type: string
            gatewayId:
              type: string
            senderId:
              type: string
              format: uuid
            providerAccount:
              oneOf:
                - $ref: '#/components/schemas/V2CryptoProviderAccount'
                - $ref: '#/components/schemas/V2FiatProviderAccount'
            source:
              oneOf:
                - $ref: '#/components/schemas/V2CryptoSource'
                - $ref: '#/components/schemas/V2FiatSource'
            destination:
              oneOf:
                - $ref: '#/components/schemas/V2FiatDestination'
                - $ref: '#/components/schemas/V2CryptoDestination'
            bridge:
              $ref: '#/components/schemas/V2Bridge'
            fromAddress:
              type: string
            reference:
              type: string
            txHash:
              type: string
            timestamp:
              type: string
              format: date-time

    WebhookDelivery:
      type: object
      description: |
        A single outbound webhook delivery attempt. Returned in list responses
        (the large `requestPayload` and `responseBody` fields are omitted from list
        items — fetch a single delivery to see them).
      properties:
        id:
          type: string
          format: uuid
          description: Unique ID of this delivery record.
        event:
          type: string
          enum: [payment_order.deposited, payment_order.pending, payment_order.validated, payment_order.settling, payment_order.settled, payment_order.refunding, payment_order.refunded, payment_order.expired, payment_order.compliance_hold, payment_order.bridge_deposit_detected, payment_order.bridge_refunded]
          description: The webhook event that was delivered.
        eventId:
          type: string
          description: Identifier of the underlying event (matches the `event_id` filter).
        orderId:
          type: string
          format: uuid
          description: The payment order this delivery relates to, if any.
        status:
          type: string
          enum: [pending, success, failed, expired]
          description: |
            Delivery status. `pending` — queued or awaiting retry; `success` — the
            endpoint returned a 2xx; `failed` — a transport error or non-2xx response,
            scheduled for retry; `expired` — gave up after the 24h retry window.
        trigger:
          type: string
          enum: [automatic, cron_retry, manual_sync, manual_async]
          description: |
            What produced this attempt. `automatic` — first send on the event;
            `cron_retry` — automatic backoff retry; `manual_sync`/`manual_async` —
            a sender-initiated retry via the retry endpoint.
        httpStatusCode:
          type: integer
          description: HTTP status code returned by your endpoint (0 if no response was received).
          example: 200
        attemptNumber:
          type: integer
          description: 1-based attempt counter for this delivery.
          example: 1
        destinationUrl:
          type: string
          format: uri
          description: The webhook URL the request was sent to.
        signature:
          type: string
          description: The `X-Paycrest-Signature` (HMAC-SHA256 hex) sent with the request.
        errorMessage:
          type: string
          description: Transport or HTTP error message, if the attempt failed.
        durationMs:
          type: integer
          description: Round-trip duration of the attempt, in milliseconds.
        nextRetryTime:
          type: string
          format: date-time
          description: When the next automatic retry is scheduled (null once delivered or expired).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WebhookDeliveryDetail:
      description: A single webhook delivery including the frozen request payload and captured response body.
      allOf:
        - $ref: '#/components/schemas/WebhookDelivery'
        - type: object
          properties:
            requestPayload:
              type: object
              description: The exact JSON body that was (or will be) sent, frozen at first attempt.
            responseBody:
              type: string
              description: Response body returned by your endpoint, truncated to 4KB.

    WebhookDeliveryList:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'

    WebhookRetryResult:
      type: object
      description: |
        Result of a synchronous retry (`?sync=true`). Reports the HTTP outcome of
        replaying the original payload inline.
      properties:
        id:
          type: string
          format: uuid
          description: ID of the delivery record created for this retry.
        status:
          type: string
          enum: [success, failed]
        httpStatusCode:
          type: integer
          example: 200
        durationMs:
          type: integer
        errorMessage:
          type: string



servers:
  - url: https://api.paycrest.io/v2
paths:

  /sender/stats:
    get:
      tags:
        - Sender
      summary: Get sender stats
      security:
        - ApiKeyAuth: []
      servers:
        - url: https://api.paycrest.io/v2
      parameters:
        - $ref: '#/components/parameters/OptionalOrderDirection'
      responses:
        '200':
          description: Sender stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SenderStatsResponse'
        '400':
          description: Bad request (e.g. invalid `direction`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{chain_id}/{id}:
    get:
      tags:
        - General
      summary: Get order status by Gateway ID
      description: Retrieve the status of an order by its onchain Gateway ID and chain ID. Use this for smart contract integrations.
      servers:
        - url: https://api.paycrest.io/v2
      parameters:
        - in: path
          name: chain_id
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProviderOrderStatusResponse'
        '400':
          description: Bad request
        '404':
          description: Not found

  # ─── V2 Provider Action Endpoints ────────────────────────────────────────────

  /provider/orders/{id}/accept:
    post:
      tags:
        - Provider
      summary: Accept an order
      description: Provider accepts an assigned order, signalling intent to fulfill.
      security:
        - ApiKeyAuth: []
      servers:
        - url: https://api.paycrest.io/v2
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Order not found

  /provider/orders/{id}/decline:
    post:
      tags:
        - Provider
      summary: Decline an order
      description: Provider declines an assigned order. The aggregator will reassign it to another provider.
      security:
        - ApiKeyAuth: []
      servers:
        - url: https://api.paycrest.io/v2
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Order not found

  /provider/orders/{id}/fulfill:
    post:
      tags:
        - Provider
      summary: Fulfill an order
      description: Provider reports that the fiat payment has been disbursed to the recipient.
      security:
        - ApiKeyAuth: []
      servers:
        - url: https://api.paycrest.io/v2
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                txId:
                  type: string
                  description: PSP transaction ID or reference for the payout
      responses:
        '200':
          description: Order fulfilled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Order not found

  /provider/orders/{id}/cancel:
    post:
      tags:
        - Provider
      summary: Cancel an order
      description: Provider cancels a previously accepted order. The aggregator will attempt reassignment.
      security:
        - ApiKeyAuth: []
      servers:
        - url: https://api.paycrest.io/v2
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for cancellation
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Order not found

  /provider/balances:
    post:
      tags:
        - Provider
      summary: Update provider balances
      description: Provider node reports current available liquidity balances per currency.
      security:
        - ApiKeyAuth: []
      servers:
        - url: https://api.paycrest.io/v2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                balances:
                  type: array
                  items:
                    type: object
                    required:
                      - currency
                      - availableBalance
                    properties:
                      currency:
                        type: string
                        description: Fiat currency code (e.g. NGN, KES)
                      availableBalance:
                        type: string
                        description: Available balance in fiat units
      responses:
        '200':
          description: Balances updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /provider/rates/{token}/{fiat}:
    get:
      tags:
        - Provider
      summary: Get market rate
      security:
        - ApiKeyAuth: []
      servers:
        - url: https://api.paycrest.io/v2
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
        - in: path
          name: fiat
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Market rate
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MarketRateResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /provider/stats:
    get:
      tags:
        - Provider
      summary: Get provider stats
      security:
        - ApiKeyAuth: []
      servers:
        - url: https://api.paycrest.io/v2
      parameters:
        - in: query
          name: currency
          required: true
          schema:
            type: string
          description: Fiat currency code (e.g. NGN, KES).
        - $ref: '#/components/parameters/OptionalOrderDirection'
      responses:
        '200':
          description: Provider stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProviderStatsResponse'
        '400':
          description: Bad request (e.g. missing `currency`, invalid `direction`)
        '401':
          description: Unauthorized

  /provider/node-info:
    get:
      tags:
        - Provider
      summary: Get node info
      security:
        - ApiKeyAuth: []
      servers:
        - url: https://api.paycrest.io/v2
      responses:
        '200':
          description: Node info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
        '401':
          description: Unauthorized
        '503':
          description: Service unavailable

  # ─── V2 General Endpoints ─────────────────────────────────────────────────────

  /currencies:
    get:
      tags:
        - General
      summary: List supported fiat currencies
      servers:
        - url: https://api.paycrest.io/v2
      responses:
        '200':
          description: List of currencies
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportedCurrencies'

  /institutions/{currency_code}:
    get:
      tags:
        - General
      summary: List supported institutions for a currency
      servers:
        - url: https://api.paycrest.io/v2
      parameters:
        - in: path
          name: currency_code
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of institutions
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportedInstitutions'
        '400':
          description: Bad request

  /tokens:
    get:
      tags:
        - General
      summary: List supported tokens
      servers:
        - url: https://api.paycrest.io/v2
      parameters:
        - in: query
          name: network
          schema:
            type: string
            enum: [ethereum, base, bnb-smart-chain, lisk, celo, arbitrum-one, polygon, starknet, tron]
      responses:
        '200':
          description: List of tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportedTokenResponse'

  /rates/{network}/{from}/{amount}/{to}:
    get:
      tags:
        - General
      summary: Get token rate (v2)
      description: |
        Public quote on a specific network. Returns **buy** and/or **sell** quotes, order type, and refund timeout.

        **Token + fiat:** each of **`from`** / **`to`** is either an enabled **fiat currency code** or an enabled **crypto (token) symbol** on **`network`**. Exactly one must be fiat and one crypto (`.../USDT/100/NGN` and `.../NGN/100/USDT` are equivalent). **`amount`** is the **crypto notional**. Rates are **fiat per 1 token** for each side. **`from` and `to` cannot both be crypto.**

        **Ambiguous segment:** if a path value matches **both** an enabled fiat code **and** an enabled crypto symbol on that network (e.g. same string), the request returns **400** unless **`from_source`** and/or **`to_source`** is set to **`fiat`** or **`crypto`** to pick the leg.

        **Fiat + fiat:** both segments are fiat codes. The quote **bridges through USDC** on the same **`network`**. **`amount`** is denominated in **`from`** fiat. **`sell`** is **destination fiat per 1 unit of `from` fiat** (buy USDC with `from`, sell USDC for `to`). **`buy`** is **`from` fiat per 1 unit of `to` fiat** (inverse corridor; buy USDC with `to`, sell USDC for `from`)—asymmetric from **`sell`**, not a simple reciprocal.

        Path order does **not** imply trade direction for token/fiat pairs; omitting **`side`** returns **both** sides when available.

        **Provider queue:** each side carries **`providerIds`** — up to 3 provider ids ranked best first, in the order assignment would try them. Pass them to **`destination.providerIds`** on `POST /sender/orders` to lock routing to the providers you quoted. Use **`limit`** to request fewer.

        For the legacy single-number response, use **`GET /v1/rates/{token}/{amount}/{fiat}`** with optional `network` query.
      servers:
        - url: https://api.paycrest.io/v2
      parameters:
        - in: path
          name: network
          required: true
          schema:
            type: string
            enum: [ethereum, base, bnb-smart-chain, lisk, celo, arbitrum-one, polygon, starknet, tron]
          description: Blockchain network identifier (lowercase in URL).
        - in: path
          name: from
          required: true
          schema:
            type: string
          description: Fiat code or token symbol on `network` (paired with `to`).
        - in: path
          name: amount
          required: true
          schema:
            type: string
          description: For token+fiat pairs, the **token** notional. For fiat+fiat pairs, the amount in **`from`** fiat.
        - in: path
          name: to
          required: true
          schema:
            type: string
          description: Fiat code or token symbol on `network` (paired with `from`).
        - in: query
          name: side
          schema:
            type: string
            enum: [buy, sell]
          description: Return only the buy or sell quote. Omit for both sides.
        - in: query
          name: from_source
          schema:
            type: string
            enum: [fiat, crypto]
          description: When `from` matches both a fiat and a crypto asset on `network`, set to `fiat` or `crypto` to disambiguate. Ignored when `from` is unambiguous.
        - in: query
          name: to_source
          schema:
            type: string
            enum: [fiat, crypto]
          description: When `to` matches both a fiat and a crypto asset on `network`, set to `fiat` or `crypto` to disambiguate. Ignored when `to` is unambiguous.
        - in: query
          name: provider_id
          schema:
            type: string
            pattern: '^[A-Za-z]{8}$'
          description: Optional. When set, limits the quote to this provider. Must be exactly 8 alphabetic characters (A–Z, a–z). Returns a single entry in `providerIds`.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 3
            default: 3
          description: Maximum number of ranked provider ids to return in `providerIds`, per side. Values outside 1–3 return **400**.
      responses:
        '200':
          description: Token rate quote(s)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/V2RateQuoteResponse'
        '400':
          description: Bad request (invalid amount, side, provider_id, limit outside 1–3, ambiguous from/to without from_source/to_source, unsupported asset/network, etc.)
        '404':
          description: No provider available for the requested swap
        '500':
          description: Internal error while resolving rate
        '503':
          description: Temporary provider or banking/network issue for the currency

  /pubkey:
    get:
      tags:
        - General
      summary: Get aggregator public key
